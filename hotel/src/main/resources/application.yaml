spring:
    application:
        name: hotel

    config:
        import: optional:file:.env[.properties]

    datasource:
        url: jdbc:postgresql://ep-purple-mouse-ahwqrc6o-pooler.c-3.us-east-1.aws.neon.tech/hotel?&sslmode=require&channelBinding=require
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                "[format_sql]": true
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        open-in-view: false

server:
    port: 8081

jwt:
    secret: ${SECRET}
    expiration: 86400000
